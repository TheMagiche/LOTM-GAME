# Fallback host nginx vhost if Coolify is NOT installed.
# Coolify's proxy must own ports 80 and 443. If Coolify is running, do not
# enable this file — it will fight Traefik/Caddy for those ports.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lotmdnd.work.gd;

    client_max_body_size 512m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lotmdnd.work.gd;

    ssl_certificate /etc/letsencrypt/live/lotmdnd.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lotmdnd.work.gd/privkey.pem;

    client_max_body_size 512m;

    location = /nginx-health {
        proxy_pass http://127.0.0.1:__APP_PORT__/nginx-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
