# Local full-app build (GM view, Settings, full pack).
#   docker compose up --build
#   open http://localhost:3001  (add ports: ["3001:3001"] under app first)
#
# Local Player-only demo preview:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# Production / Coolify (public demo): docker-compose.prod.yml (no build on VPS).
#   GitHub Actions builds GHCR with VITE_DEPLOYMENT_MODE=demo; Coolify pulls.
#   See docs/COOLIFY.md and docs/agents/demo-vps-player-deployment.md

services:
  app:
    build: .
    image: ${LOTM_IMAGE:-lotm-game:local}
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /app/data
      MODS_DIR: /app/data/mods
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://lotmdnd.work.gd}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lotmdnd.work.gd}
      # Demo runtime flags come from docker-compose.demo.yml (local) or
      # docker-compose.prod.yml (VPS). Do not set them here — this file is the full app.
    init: true
    volumes:
      - lotm-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  lotm-data:
