appId: com.themagiche.lotm
productName: Lord of the Mysteries
copyright: Unofficial fan content. Narrative Engine is MIT licensed.
directories:
  output: release
artifactName: LOTM-${version}-${os}-${arch}.${ext}
files:
  - dist/**
  - electron/**
  - server.bundle.cjs
  - package.json
asar: true
asarUnpack:
  - server.bundle.cjs
  - node_modules/**
extraResources:
  - from: public/bundled-mods
    to: bundled-mods
  - from: gamedata
    to: gamedata
mac:
  category: public.app-category.games
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Game
  target:
    - AppImage
    - deb
npmRebuild: false
