# Production / Coolify: pull a prebuilt GHCR image only — no `build:` on the VPS.
# GitHub Actions (.github/workflows/deploy.yml) builds and pushes the image;
# the Coolify deploy webhook triggers pull + restart.
#
# Coolify setup:
#   Compose file: docker-compose.prod.yml
#   LOTM_IMAGE=ghcr.io/<owner>/<repo>:latest
#   Disable automatic deploy on git push (use the GHA webhook only).
#
# Local builds still use docker-compose.yml (`docker compose up --build`).

services:
  app:
    image: ${LOTM_IMAGE:?Set LOTM_IMAGE to ghcr.io/owner/repo:latest}
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /app/data
      MODS_DIR: /app/data/mods
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://lotmdnd.work.gd}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lotmdnd.work.gd}
    init: true
    volumes:
      - lotm-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  lotm-data:
