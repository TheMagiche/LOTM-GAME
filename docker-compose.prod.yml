# Production / Coolify: pull a prebuilt GHCR image only — no `build:` on the VPS.
# GitHub Actions (.github/workflows/deploy.yml) builds the Player-only demo
# (VITE_DEPLOYMENT_MODE=demo) and pushes GHCR; Coolify pulls and restarts.
# See docs/agents/demo-vps-player-deployment.md
#
# Coolify setup:
#   Compose file: docker-compose.prod.yml
#   LOTM_IMAGE=ghcr.io/<owner>/<repo>:latest
#   Disable automatic deploy on git push (use the GHA webhook only).
#
# Local full app: docker compose up --build
# Local demo preview: docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build

services:
  app:
    image: ${LOTM_IMAGE:?Set LOTM_IMAGE to ghcr.io/themagiche/lotm-game:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /app/data
      MODS_DIR: /app/data/mods
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://lotmdnd.work.gd}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lotmdnd.work.gd}
      # Runtime demo lock (TTS off, session purge, index.html boot flag).
      # The Player UI also requires a demo Vite bundle in the pulled image.
      DEMO_MODE: "1"
      TTS_DISABLED: "1"
    init: true
    volumes:
      - lotm-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  lotm-data:
