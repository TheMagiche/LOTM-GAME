name: Deploy to Coolify

# GitHub Actions builds the Player-only demo image (native sqlite + Vite
# with VITE_DEPLOYMENT_MODE=demo) so the VPS does not compile on deploy.
# Coolify then pulls GHCR and restarts the stack.
#
# Required GitHub secrets:
#   COOLIFY_WEBHOOK  — Coolify app → Configuration → Webhooks → Deploy Webhook
# Optional:
#   COOLIFY_TOKEN    — Bearer token if the webhook requires Authorization
#
# On the Coolify server, authenticate GHCR so compose can pull a private image:
#   echo "$GITHUB_TOKEN" | docker login ghcr.io -u USER --password-stdin

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-lotm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          cache-to: type=gha,mode=min
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=24-bookworm-slim
            VITE_DEPLOYMENT_MODE=demo
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  
